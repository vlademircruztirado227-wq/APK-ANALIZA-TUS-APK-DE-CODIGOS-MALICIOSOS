<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Mi Página Web</h1>
            <div class="estado desconectado" id="estado">
                <span class="punto"></span>
                <span class="estado-texto">Desconectado</span>
            </div>
        </header>
        <div class="controles">
            <input type="url" id="url" placeholder="https://ejemplo.com" autocomplete="off" spellcheck="false">
            <button type="button" id="accion">Conectar</button>
        </div>
    </div>
</body>
</html>
